[project]
name = "mcp-bybit-server"
version = "0.1.3"
description = "Bybit server for mcp"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.6.0",
    "pybit>=2.4.0",
    "python-dotenv>=0.19.0",
]

[project.scripts]
mcp-bybit-server = "server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]  # long lines are common in API docstrings

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

